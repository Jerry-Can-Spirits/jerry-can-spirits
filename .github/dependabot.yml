version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    reviewers:
      - "Jerry-Can-Spirits"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch updates together
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Allow automatic security updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 10.75.2 and 10.75.3 both return 500 from every /api/ route on Workers
      # (the 28 Sep outage; isolated 5 Oct 2026, 10.75.2 confirmed by CI on #1374).
      # 10.75.1 is untested and skipped as a precaution. Later
      # releases still come through and face the CI smoke test.
      - dependency-name: "@sentry/nextjs"
        versions: ["10.75.1", "10.75.2", "10.75.3"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"

name: Backups

# Weekly copies of the two stores nothing else backs up: the production D1
# database (trade applications, accounts, orders, referral codes) and the Sanity
# dataset (the whole Field Manual). Until this existed the only recovery for D1
# was Cloudflare's 30-day point-in-time restore and Sanity had nothing at all
# (Audit E, 4 Oct 2026). Each run keeps its files as workflow artefacts for
# eight weeks. Restoring from them is in docs/runbooks/2026-10-04-rollback-and-restore.md.
#
# This repository is public, and anyone with a GitHub account can download a
# public repository's workflow artefacts. The exports hold customer data, so
# each one is encrypted with AES-256 under BACKUP_PASSPHRASE before upload,
# and a run with no passphrase stops before it exports anything. The first
# run on 4 Oct 2026 uploaded both files in clear; they were deleted within
# minutes and this guard added.
#
# Secrets: BACKUP_PASSPHRASE (long and random, kept in 1Password: without it
# the artefacts cannot be opened), CLOUDFLARE_D1_BACKUP_TOKEN (an API token
# with D1 Edit on this account and nothing else) and SANITY_AUTH_TOKEN (a
# Sanity robot token with the Viewer role). The account id and project id are
# public identifiers.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

jobs:
  d1:
    name: D1 export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to run without a passphrase
        run: test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set; nothing is exported."; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export the production database
        run: npx wrangler d1 export jerry-can-spirits-db --remote --output=d1-jerry-can-spirits-db.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a986a3fd3a89126982400fd746a65b7a

      - name: Compress and encrypt
        run: |
          gzip d1-jerry-can-spirits-db.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -in d1-jerry-can-spirits-db.sql.gz -out d1-jerry-can-spirits-db.sql.gz.enc
          rm d1-jerry-can-spirits-db.sql.gz
          ls -l d1-jerry-can-spirits-db.sql.gz.enc

      - name: Keep the export
        uses: actions/upload-artifact@v7
        with:
          name: d1-jerry-can-spirits-db-${{ github.run_id }}
          path: d1-jerry-can-spirits-db.sql.gz.enc
          retention-days: 56
          if-no-files-found: error

  sanity:
    name: Sanity export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run without a passphrase
        run: test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set; nothing is exported."; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export the production dataset
        run: npx sanity dataset export production sanity-production.tar.gz --overwrite
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 5mtjmb0t
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Encrypt
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -in sanity-production.tar.gz -out sanity-production.tar.gz.enc
          rm sanity-production.tar.gz
          ls -l sanity-production.tar.gz.enc

      - name: Keep the export
        uses: actions/upload-artifact@v7
        with:
          name: sanity-production-${{ github.run_id }}
          path: sanity-production.tar.gz.enc
          retention-days: 56
          if-no-files-found: error

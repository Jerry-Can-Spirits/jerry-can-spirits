name: Smoke (live site)

# Every fifteen minutes, hit the routes a customer depends on and fail if any
# is broken. A failed run posts to the 2iC Teams channel through the
# TEAMS_WEBHOOK_URL secret (a Teams Workflows "post to a channel when a webhook
# request is received" flow); without that secret it only emails the committer
# of this file. See scripts/smoke.mjs for what is checked and why (the 18-hour
# API outage of 28-29 Sep 2026).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-production
  cancel-in-progress: false

jobs:
  smoke:
    name: Live site answers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Smoke the live site
        run: node scripts/smoke.mjs https://jerrycanspirits.co.uk
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}

      - name: Tell the Teams channel
        if: failure()
        run: bash scripts/notify-teams.sh "Live site smoke failed" "A route a customer depends on is not answering on jerrycanspirits.co.uk. Check the run, then the rollback runbook (docs/runbooks/2026-10-04-rollback-and-restore.md)." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

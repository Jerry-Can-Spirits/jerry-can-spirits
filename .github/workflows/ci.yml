name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege for the GITHUB_TOKEN: CI only reads the repo.
permissions:
  contents: read

# Supersede in-flight runs on the same ref — rapid pushes were queueing
# full runs and starving the runner pool.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  # The unit suite ran nowhere until 21 August 2026. Seven tests had been failing
  # on main since the pourability rulings of 12 and 16 August, and nothing
  # reported it, because CI checked types, lint and the build and never the
  # tests. Guards that only fire when somebody remembers to run them locally are
  # not guards.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # One build, the way the deploy does it: OpenNext runs `next build` itself
      # (standalone output, which the smoke test's Worker bundle needs) and then
      # bundles the Worker. The fetch cache is cleared first exactly as
      # `npm run build` does.
      - name: Build project and bundle the Worker (OpenNext)
        run: node -e "require('fs').rmSync('.next/cache/fetch-cache',{recursive:true,force:true})" && npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SANITY_PROJECT_ID: 5mtjmb0t
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_CLOUDFLARE_ACCOUNT_HASH: T4IfqPfa6E-8YtW8Lo02gQ
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next
          retention-days: 7

      # The smoke test. `next build` passing says nothing about whether the
      # Worker bundle loads on Cloudflare's runtime: on 28 Sep 2026 a dependency
      # bump built green, deployed, and every /api/ route (checkout included)
      # returned 500 for eighteen hours. So the same job runs the bundle built
      # above on workerd locally and hits the routes a customer depends on.
      # See scripts/smoke.mjs.
      - name: Start the Worker locally
        # Placeholder secrets: the webhook routes only need a value to exist so
        # they reach their signature check and answer 401 rather than 500.
        run: |
          printf 'SHOPIFY_WEBHOOK_SECRET=ci-smoke-placeholder\nSANITY_WEBHOOK_SECRET=ci-smoke-placeholder\n' > .dev.vars
          (npx opennextjs-cloudflare preview -- --port 8787 > worker-preview.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:8787/api/geo/; then echo "worker up after ${i} tries"; break; fi
            sleep 2
          done

      - name: Smoke the local Worker
        run: node scripts/smoke.mjs http://localhost:8787

      - name: Worker log on failure
        if: failure()
        run: tail -n 200 worker-preview.log || true

  # Summary job — required status check for branch protection
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi

  purge-cache:
    name: Purge Cloudflare Cache
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 180

      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      # What shipped has to answer. Same script as the PR gate, against the
      # live site, once the deploy has had its three minutes.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Smoke the live site
        run: node scripts/smoke.mjs https://jerrycanspirits.co.uk
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
